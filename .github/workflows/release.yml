# RHEMA — release builds (SUPPORTED pipeline). Everything here is pinned
# to exact, tested versions: actions by commit SHA, Node by exact patch,
# runner images by name — a release build never changes under us. Version
# bumps arrive as Dependabot PRs (see .github/dependabot.yml) and get
# proven by the Canary workflow before this file moves. Pushing a v* tag
# (or a manual run) builds the full binary set and publishes it as a
# GitHub Release. macOS builds are Developer ID-signed and notarized: the
# signing key material lives ONLY in the protected 'signing' environment,
# and the macos job waits for a required reviewer before it can read it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      # hermetic unit suites only — the e2e suites need a live display
      - run: npm test

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      # --publish never: electron-builder's own GitHub publish wants a token
      # and fights the release job; the release job below is the publisher.
      # The updater channel files (latest-linux*.yml) ride along as assets.
      - run: npm run package:linux -- --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/latest-linux*.yml
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-26
    # Protected environment: the five secrets below exist ONLY here, and
    # every run of this job waits for its required reviewer to approve
    # before the signing key is exposed to it.
    environment: signing
    env:
      CSC_LINK: "${{ secrets.CSC_LINK }}"
      CSC_KEY_PASSWORD: "${{ secrets.CSC_KEY_PASSWORD }}"
      APPLE_API_KEY: "${{ secrets.APPLE_API_KEY }}"
      APPLE_API_KEY_ID: "${{ secrets.APPLE_API_KEY_ID }}"
      APPLE_API_ISSUER: "${{ secrets.APPLE_API_ISSUER_ID }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      # Developer ID sign + notarize (notarytool) + staple: electron-builder
      # picks all of this up from the env vars above. No -c overrides.
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # RELEASE-NOTES.md (alpha/no-liability posture) leads, generated notes follow
      - run: gh release create "$REF" -R "$GITHUB_REPOSITORY" artifacts/* --title "Rhema $REF" --notes-file RELEASE-NOTES.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
